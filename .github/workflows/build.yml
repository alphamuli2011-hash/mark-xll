
name: Build Mark-XLVI EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find and extract zip
        run: |
          $zip = Get-ChildItem -Recurse -Filter "*.zip" | Select-Object -First 1
          Write-Host "Found zip: $($zip.FullName)"
          Expand-Archive -Path $zip.FullName -DestinationPath "." -Force

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install core dependencies
        run: pip install sounddevice pillow requests beautifulsoup4 numpy psutil send2trash qrcode[pil]

      - name: Install Google AI dependencies
        run: pip install google-genai google-generativeai

      - name: Install web and media dependencies
        run: pip install duckduckgo-search youtube-transcript-api python-pptx opencv-python mss

      - name: Install Windows-specific dependencies
        run: pip install comtypes pycaw win10toast pywinauto pyautogui pyperclip pygetwindow

      - name: Install server dependencies
        run: pip install fastapi "uvicorn[standard]" cryptography python-multipart

      - name: Install PyQt6
        run: pip install PyQt6

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Create runtime hooks
        run: |
          $mainpy = Get-ChildItem -Recurse -Filter "main.py" | Select-Object -First 1
          $projectDir = $mainpy.DirectoryName
          $utf8 = "import os`nos.environ['PYTHONUTF8'] = '1'"
          $hook = "import subprocess, sys`n_orig_run = subprocess.run`n_orig_popen = subprocess.Popen`n_NO_WINDOW = 0x08000000`ndef _patched_run(*args, **kwargs):`n    if sys.platform == 'win32':`n        kwargs.setdefault('creationflags', _NO_WINDOW)`n    return _orig_run(*args, **kwargs)`ndef _patched_popen(*args, **kwargs):`n    if sys.platform == 'win32':`n        kwargs.setdefault('creationflags', _NO_WINDOW)`n    return _orig_popen(*args, **kwargs)`nsubprocess.run = _patched_run`nsubprocess.Popen = _patched_popen"
          [System.IO.File]::WriteAllText("$projectDir\utf8_hook.py", $utf8)
          [System.IO.File]::WriteAllText("$projectDir\runtime_hook.py", $hook)

      - name: Build EXE with PyInstaller
        run: |
          $mainpy = Get-ChildItem -Recurse -Filter "main.py" | Select-Object -First 1
          $projectDir = $mainpy.DirectoryName
          Write-Host "Building from: $projectDir"
          cd $projectDir
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "Mark-XLVI" `
            --runtime-hook "utf8_hook.py" `
            --runtime-hook "runtime_hook.py" `
            --add-data "config;config" `
            --add-data "core/prompt.txt;core" `
            --add-data "dashboard/static;dashboard/static" `
            --hidden-import "sounddevice" `
            --hidden-import "google.genai" `
            --hidden-import "google.generativeai" `
            --hidden-import "PIL" `
            --hidden-import "cv2" `
            --hidden-import "pyautogui" `
            --hidden-import "pyperclip" `
            --hidden-import "pygetwindow" `
            --hidden-import "mss" `
            --hidden-import "psutil" `
            --hidden-import "send2trash" `
            --hidden-import "fastapi" `
            --hidden-import "uvicorn" `
            --hidden-import "cryptography" `
            --hidden-import "comtypes" `
            --hidden-import "pycaw" `
            --hidden-import "win10toast" `
            --hidden-import "pywinauto" `
            --hidden-import "PyQt6" `
            --hidden-import "PyQt6.QtCore" `
            --hidden-import "PyQt6.QtGui" `
            --hidden-import "PyQt6.QtWidgets" `
            --collect-all "google.genai" `
            --collect-all "google.generativeai" `
            --collect-all "uvicorn" `
            --collect-all "fastapi" `
            --collect-all "PyQt6" `
            main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mark-XLVI-Windows
          path: "**/dist/Mark-XLVI/"
          retention-days: 30
