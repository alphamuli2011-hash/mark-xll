
name: Build Mark-XLVI EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install binary dependencies first
        run: |
          pip install --prefer-binary numpy pillow opencv-python pyautogui pyperclip mss psutil

      - name: Install sounddevice
        run: pip install sounddevice --prefer-binary

      - name: Install Google AI packages
        run: pip install google-genai google-generativeai --prefer-binary

      - name: Install remaining dependencies
        run: |
          pip install --prefer-binary `
            requests `
            beautifulsoup4 `
            duckduckgo-search `
            pygetwindow `
            send2trash `
            youtube-transcript-api `
            python-pptx `
            fastapi `
            "uvicorn[standard]" `
            cryptography `
            python-multipart `
            comtypes `
            pycaw `
            win10toast `
            pywinauto `
            "qrcode[pil]"

      - name: Install playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --onedir `
            --windowed `
            --name "Mark-XLVI" `
            --add-data "config;config" `
            --add-data "core/prompt.txt;core" `
            --add-data "dashboard/static;dashboard/static" `
            --hidden-import "sounddevice" `
            --hidden-import "google.genai" `
            --hidden-import "google.generativeai" `
            --hidden-import "PIL" `
            --hidden-import "cv2" `
            --hidden-import "pyautogui" `
            --hidden-import "pyperclip" `
            --hidden-import "pygetwindow" `
            --hidden-import "mss" `
            --hidden-import "psutil" `
            --hidden-import "send2trash" `
            --hidden-import "fastapi" `
            --hidden-import "uvicorn" `
            --hidden-import "cryptography" `
            --hidden-import "comtypes" `
            --hidden-import "pycaw" `
            --hidden-import "win10toast" `
            --hidden-import "pywinauto" `
            --collect-all "google.genai" `
            --collect-all "google.generativeai" `
            --collect-all "uvicorn" `
            --collect-all "fastapi" `
            main.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mark-XLVI-Windows
          path: dist/Mark-XLVI/
          retention-days: 30
